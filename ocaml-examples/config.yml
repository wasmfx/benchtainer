# List of valid engines
ENGINES : [ "d8", "wasmtime", "wizard" ]

# (Relative) paths to engines and engine-specific options
# Wasmtime
WASMTIME_PATH : "/wasmtime/target/release/wasmtime"
WASMTIME_OPTIONS : "run --allow-precompiled -W=exceptions,function-references,gc,stack-switching <BENCHMARK>.bc.wasm.assets/code.wasm"

# V8
D8_PATH : "/v8/v8/out/x64.release/d8"
D8_OPTIONS : " --experimental-wasm-wasmfx -e \"load('../../../load.mjs');load('<BENCHMARK>.bc.wasm.js');\""

# Wizard
WIZARD_PATH : "/wizard-engine/bin/wizeng.x86-64-linux"
WIZARD_OPTIONS : "--ext:stack-switching --ext:gc --stack-size=65536 --mode=jit <BENCHMARK>.bc.wasm.assets/code.wasm"

# List of benchmarks
BENCHMARKS_FIBER_C : [
    "itersum",
    "treesum",
    "c10m",
    "pi",
    "scheduler",
  ]